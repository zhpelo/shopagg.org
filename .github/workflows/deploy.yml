name: Deploy website

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types:
      - shopagg-cms-release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shopagg-org-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync SHOPAGG CMS releases
        run: npm run sync:releases
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Persist release updates
        run: |
          if git diff --quiet -- src/data/releases.json src/data/compatibility.json; then
            echo "Release data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/releases.json src/data/compatibility.json
          git commit -m "chore: sync SHOPAGG CMS releases"
          git push origin HEAD:main

      - name: Validate Astro
        run: npm run check

      - name: Build static website
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
